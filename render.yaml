# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# Values marked "sync: false" are secrets: Render asks for them in the dashboard; they never go in git.
# This Blueprint ("Nabad1") manages PRODUCTION only. Production deploys from the "production" branch: releasing is a
# pull request from main to production. Auto Sync is off and the Blueprint reads this file from main, so changes here
# apply only when someone clicks "Manual sync" on the Blueprint after a release (docs/environments.md).
# Staging lives in a separate Render workspace (its own free hours), created by hand; see the reference at the end.
services:
  - type: web
    name: nabad-backend
    runtime: node
    plan: free
    branch: production
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: MONGO_DB_NAME
        value: nabad_production
      - key: CLIENT_ORIGIN
        value: https://nabad-psi.vercel.app
      # Shared with the Next.js proxy on Vercel (Production environment), which vouches for each visitor's IP
      # (docs/environments.md, "Client IP"). Entered in the dashboard. API_PROXY_REQUIRED=true, which refuses requests
      # without it, is set in the dashboard last, never here: a Blueprint sync must not turn it on early.
      - key: API_PROXY_SECRET
        sync: false
      - key: SESSION_IDLE_TIMEOUT
        value: 30m
      - key: SESSION_ABSOLUTE_TIMEOUT
        value: 12h
      - key: SESSION_WARNING_BEFORE
        value: 2m
      # Keep "false" until signup verifies the email; with "true" a mistyped email locks the user out.
      - key: TWO_FACTOR_ON_SIGNUP
        value: "false"
      # Render's free tier blocks outbound SMTP on 25, 465 and 587, so sending hung until it timed out.
      # Brevo also accepts SMTP on 2525 (STARTTLS, so SMTP_SECURE stays false).
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Key for the HMAC of emailed sign-in codes: at least 32 random characters, different from JWT_SECRET.
      # Required: the server refuses to start in production without it.
      - key: TWO_FACTOR_CODE_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional: leave both Google credentials empty to disable Google sign-in (never set just one).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Goes through the frontend's /api rewrite so the OAuth state cookie is on the same site.
      # Must also be listed as an authorized redirect URI on the Google OAuth client.
      - key: GOOGLE_REDIRECT_URI
        value: https://nabad-psi.vercel.app/api/auth/google/callback
      # The AI provider is set on the Render dashboard (production uses Google Gemini through its
      # OpenAI-compatible endpoint), so Blueprint deploys never overwrite it.
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_MS
        value: "60000"
      # Enable for the multimodal model; image uploads must be photos of written reports.
      - key: LLM_VISION_ENABLED
        value: "true"
      # Error tracking with Sentry (optional: without it nothing is sent). Reports carry only the error type, stack
      # trace, route, status, requestId and environment, never health or personal data (docs/architecture.md).
      - key: SENTRY_DSN
        sync: false

