name: Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build frontend
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test API with temporary MongoDB
        run: npm test

  # SCRUM-282: the 50 realistic triage cases (backend/tests/triage-quality) as their own check, so a
  # change that makes triage less accurate is named on the pull request. The scorecard is on the run's
  # summary page. No database or AI provider is needed, so the MongoDB download is skipped.
  triage-quality:
    name: Triage quality (50 cases)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run the triage quality test set
        run: npm run test:triage-quality
