name: Docker Images

# Builds both images on every pull request so the Dockerfiles and docker-compose.yml never silently break.
# Nothing is pushed: production still deploys from Render (render.yaml) and Vercel.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      # Empty on fork and Dependabot pull requests (see "Log in to Docker Hub").
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every image in Dockerfiles, compose files and workflows is pinned by exact tag + digest (docs/docker.md).
      - name: Check image pins
        run: node --test ops/docker/tests/image-pins.test.js

      # Read-only Docker Hub token, so pulls aren't rate-limited. Fork and Dependabot pull requests
      # don't get repository secrets: DOCKERHUB_USERNAME is empty, this step is skipped, pulls are anonymous.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check docker-compose.yml
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag nabad-backend:ci backend

      - name: Build frontend image
        run: docker build --tag nabad-frontend:ci --build-arg BACKEND_URL=http://backend:5000 frontend
