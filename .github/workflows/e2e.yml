name: End-to-end Tests

# Runs the Selenium suite (tests/test_nabad.py) in headless Chrome against a throwaway copy of the whole app,
# started from docker-compose.yml. Never production: the database, inbox and accounts are gone after the job.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NABAD_BASE_URL: http://localhost:3000
      NABAD_MAILPIT_API: http://localhost:8025/api
      NABAD_HEADLESS: "1"
      NABAD_ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts
      APPOINTMENT_REMINDER_INTERVAL_MS: "2000"
      # Empty on fork and Dependabot pull requests (see "Log in to Docker Hub").
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read-only Docker Hub token, so pulls aren't rate-limited. Fork and Dependabot pull requests
      # don't get repository secrets: DOCKERHUB_USERNAME is empty, this step is skipped, pulls are anonymous.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The BuildKit image is pulled from Docker Hub too, so it is pinned like every other image.
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Build backend image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: nabad-backend:e2e
          cache-from: type=gha,scope=nabad-backend
          cache-to: type=gha,scope=nabad-backend,mode=max

      - name: Build frontend image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: nabad-frontend:e2e
          build-args: BACKEND_URL=http://backend:5000
          cache-from: type=gha,scope=nabad-frontend
          cache-to: type=gha,scope=nabad-frontend,mode=max

      - name: Start the app with Docker Compose
        run: docker compose up -d

      - name: Wait for the frontend and API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health/ready >/dev/null && curl -fsS -o /dev/null http://localhost:3000/; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "The app did not become ready in 3 minutes"
          docker compose ps
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test requirements
        run: pip install -r tests/requirements.txt

      - name: Install pinned accessibility audit engine
        run: npm ci --prefix tests/accessibility --ignore-scripts --no-audit --no-fund

      - name: Verify usability study call and SMS guard
        run: python tests/usability/emergency_study.py --check

      # The runner's preinstalled Google Chrome; Selenium Manager downloads the matching ChromeDriver.
      - name: Run Selenium suite
        run: python tests/test_nabad.py

      - name: Collect Docker Compose logs
        if: always()
        run: |
          mkdir -p "$NABAD_ARTIFACTS_DIR"
          docker compose ps > "$NABAD_ARTIFACTS_DIR/docker-compose-ps.txt" 2>&1
          docker compose logs --no-color --timestamps > "$NABAD_ARTIFACTS_DIR/docker-compose.log" 2>&1

      - name: Upload failure screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the app and remove its data
        if: always()
        run: docker compose down -v
