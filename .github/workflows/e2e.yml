name: End-to-end Tests

# Runs the Selenium suite (tests/test_nabad.py) in headless Chrome against a throwaway copy of the whole app,
# started from docker-compose.yml. Never production: the database, inbox and accounts are gone after the job.
on:
  pull_request:
    branches:
      - main

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NABAD_BASE_URL: http://localhost:3000
      NABAD_MAILPIT_API: http://localhost:8025/api
      NABAD_HEADLESS: "1"
      NABAD_ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the app with Docker Compose
        run: docker compose up -d --build

      - name: Wait for the frontend and API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health/ready >/dev/null && curl -fsS -o /dev/null http://localhost:3000/; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "The app did not become ready in 3 minutes"
          docker compose ps
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test requirements
        run: pip install -r tests/requirements.txt

      # The runner's preinstalled Google Chrome; Selenium Manager downloads the matching ChromeDriver.
      - name: Run Selenium suite
        run: python tests/test_nabad.py

      - name: Collect Docker Compose logs
        if: always()
        run: |
          mkdir -p "$NABAD_ARTIFACTS_DIR"
          docker compose ps > "$NABAD_ARTIFACTS_DIR/docker-compose-ps.txt" 2>&1
          docker compose logs --no-color --timestamps > "$NABAD_ARTIFACTS_DIR/docker-compose.log" 2>&1

      - name: Upload failure screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the app and remove its data
        if: always()
        run: docker compose down -v
